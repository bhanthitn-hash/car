<style>
  :root{
    --bg:#14161A;
    --surface:#1E2128;
    --surface-2:#262A33;
    --line:#33384433;
    --accent:#F5B700;
    --accent-dim:#C99400;
    --blue:#4D7EA8;
    --text:#F2F0EA;
    --text-muted:#9BA0AA;
    --danger:#D64545;
    --success:#4CAF6D;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Sarabun',sans-serif;
    line-height:1.5;
    padding-bottom:60px;
  }
  h1,h2,h3,.display{font-family:'Kanit',sans-serif; font-weight:700;}
  a{color:inherit; text-decoration:none;}
  button{font-family:'Sarabun',sans-serif; cursor:pointer; border:none;}
  ::selection{background:var(--accent); color:var(--bg);}

  /* ---------- Header ---------- */
  header{
    position:sticky; top:0; z-index:40;
    background:rgba(20,22,26,0.92);
    backdrop-filter:blur(8px);
    border-bottom:1px solid #ffffff14;
    padding:14px 20px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .logo{display:flex; align-items:center; gap:10px;}
  .logo-mark{width:34px; height:34px; flex-shrink:0;}
  .logo-text{font-family:'Kanit',sans-serif; font-weight:800; font-size:19px; letter-spacing:0.3px;}
  .logo-text span{color:var(--accent);}
  .logo-sub{font-size:10px; color:var(--text-muted); letter-spacing:2px; margin-top:-2px;}
  .admin-btn{
    background:transparent; color:var(--text-muted); border:1px solid #ffffff22;
    padding:8px 14px; border-radius:20px; font-size:13px; transition:.2s;
  }
  .admin-btn:hover{border-color:var(--accent); color:var(--accent);}

  /* ---------- LINE floating button ---------- */
  .line-fab{
    position:fixed; right:16px; bottom:20px; z-index:80;
    display:flex; align-items:center; gap:8px;
    background:#06C755; color:#fff; padding:12px 18px; border-radius:30px;
    box-shadow:0 8px 22px #06C75555; font-family:'Kanit',sans-serif; font-weight:600; font-size:14px;
    transition:transform .15s;
  }
  .line-fab:hover{transform:scale(1.05);}
  .line-fab svg{width:20px; height:20px;}

  .line-btn{
    width:100%; display:flex; align-items:center; justify-content:center; gap:8px;
    background:#06C755; color:#fff; font-weight:700; font-family:'Kanit',sans-serif;
    padding:14px; border-radius:10px; font-size:15px;
  }
  .cta-row{display:flex; flex-direction:column; gap:8px; margin-top:6px;}
  .cta-note{text-align:center; font-size:11.5px; color:var(--text-muted); margin-top:8px;}

  /* ---------- Share ---------- */
  .icon-round{
    width:34px; height:34px; border-radius:50%; background:var(--surface-2); color:var(--text);
    display:flex; align-items:center; justify-content:center; border:1px solid #ffffff18;
  }
  .header-actions{display:flex; align-items:center; gap:8px;}
  .share-menu{
    display:none; position:absolute; right:20px; top:60px; z-index:60;
    background:var(--surface); border:1px solid #ffffff18; border-radius:12px; padding:8px;
    box-shadow:0 12px 28px #00000070; min-width:190px;
  }
  .share-menu.open{display:block;}
  .share-menu button{
    width:100%; text-align:left; background:transparent; color:var(--text); padding:10px 10px;
    border-radius:8px; font-size:13.5px; display:flex; align-items:center; gap:10px;
  }
  .share-menu button:hover{background:var(--surface-2);}

  /* ---------- Hero ---------- */
  .hero{
    padding:44px 20px 28px; position:relative; overflow:hidden;
    background:
      radial-gradient(circle at 85% -10%, #F5B70022, transparent 55%),
      repeating-linear-gradient(90deg, transparent, transparent 38px, #ffffff08 38px, #ffffff08 40px);
  }
  .road-line{
    position:absolute; left:0; right:0; bottom:0; height:3px;
    background:repeating-linear-gradient(90deg, var(--accent) 0 22px, transparent 22px 40px);
    opacity:.5;
  }
  .hero h1{font-size:30px; line-height:1.25; max-width:480px;}
  .hero h1 .hl{color:var(--accent);}
  .hero p{color:var(--text-muted); margin-top:10px; font-size:14.5px; max-width:420px;}

  .stat-row{display:flex; gap:22px; margin-top:24px; flex-wrap:wrap;}
  .stat-block{min-width:110px;}
  .stat-label{font-size:11px; color:var(--text-muted); letter-spacing:1px; margin-bottom:6px;}
  .odometer{display:flex; gap:2px;}
  .digit{
    background:#0D0E11; color:var(--accent); font-family:'Roboto Mono',monospace;
    font-weight:700; font-size:18px; padding:5px 6px; border-radius:4px;
    box-shadow:inset 0 0 0 1px #ffffff14, inset 0 2px 4px #00000080;
    min-width:14px; text-align:center;
  }
  .digit.sep{background:transparent; box-shadow:none; color:var(--text-muted); padding:5px 1px; font-size:16px;}
  .digit.unit{background:transparent; box-shadow:none; color:var(--text-muted); font-family:'Sarabun',sans-serif; font-size:13px; font-weight:500; padding:5px 2px;}

  /* ---------- Search / Filters ---------- */
  .toolbar{
    padding:18px 20px; display:flex; flex-direction:column; gap:12px;
    background:var(--surface); border-bottom:1px solid #ffffff10;
    position:sticky; top:63px; z-index:30;
  }
  .search-row{display:flex; gap:10px;}
  .search-box{
    flex:1; display:flex; align-items:center; gap:8px;
    background:var(--surface-2); border:1px solid #ffffff18; border-radius:10px;
    padding:10px 14px;
  }
  .search-box input{
    background:transparent; border:none; outline:none; color:var(--text); flex:1; font-size:14px; font-family:'Sarabun',sans-serif;
  }
  .search-box input::placeholder{color:var(--text-muted);}
  .filter-toggle{
    background:var(--surface-2); border:1px solid #ffffff18; border-radius:10px;
    padding:10px 16px; font-size:14px; color:var(--text); display:flex; align-items:center; gap:6px;
    white-space:nowrap;
  }
  .filter-toggle.active{border-color:var(--accent); color:var(--accent);}

  .filter-panel{
    display:none; gap:12px; flex-wrap:wrap; padding-top:4px;
  }
  .filter-panel.open{display:flex;}
  .filter-panel select, .filter-panel input[type=number]{
    background:var(--surface-2); border:1px solid #ffffff18; color:var(--text);
    padding:9px 10px; border-radius:8px; font-size:13px; font-family:'Sarabun',sans-serif;
  }
  .filter-group{display:flex; flex-direction:column; gap:4px;}
  .filter-group label{font-size:11px; color:var(--text-muted);}
  .range-pair{display:flex; gap:6px; align-items:center;}
  .range-pair input{width:90px;}
  .clear-filters{
    background:transparent; color:var(--danger); font-size:12.5px; align-self:flex-end;
    border:1px solid #D6454540; padding:9px 12px; border-radius:8px;
  }

  .result-count{padding:14px 20px 0; font-size:13px; color:var(--text-muted);}
  .result-count b{color:var(--text);}

  /* ---------- Catalog Grid ---------- */
  .catalog{
    padding:16px 20px 40px; display:grid; gap:16px;
    grid-template-columns:repeat(auto-fill, minmax(280px,1fr));
  }
  .card{
    background:var(--surface); border:1px solid #ffffff10; border-radius:14px;
    overflow:hidden; transition:transform .18s, border-color .18s; cursor:pointer;
  }
  .card:hover{transform:translateY(-3px); border-color:#ffffff2a;}
  .card-photo{
    height:150px; position:relative; display:flex; align-items:center; justify-content:center;
    background:
      repeating-linear-gradient(90deg, transparent, transparent 26px, #ffffff06 26px, #ffffff06 27px),
      linear-gradient(160deg, #ffffff08, transparent);
    overflow:hidden;
  }
  .card-photo img{width:100%; height:100%; object-fit:cover;}
  .card-photo svg{width:64%; filter:drop-shadow(0 6px 10px #00000060);}
  .status-badge{
    position:absolute; top:10px; left:10px; font-size:10.5px; padding:4px 9px; border-radius:20px;
    font-weight:600; letter-spacing:.3px;
  }
  .status-available{background:#4CAF6D22; color:var(--success); border:1px solid #4CAF6D50;}
  .status-sold{background:#D6454522; color:var(--danger); border:1px solid #D6454550;}
  .card-body{padding:14px 16px 16px;}
  .card-title{font-family:'Kanit',sans-serif; font-weight:600; font-size:16px;}
  .card-sub{font-size:12.5px; color:var(--text-muted); margin-top:2px;}
  .card-tags{display:flex; gap:6px; margin-top:9px; flex-wrap:wrap;}
  .tag{
    font-size:11px; background:var(--surface-2); color:var(--text-muted);
    padding:3px 8px; border-radius:6px; border:1px solid #ffffff12;
  }
  .card-price{margin-top:12px; display:flex; align-items:baseline; gap:4px;}
  .card-price .odometer .digit{font-size:15px; padding:4px 5px;}
  .empty-state{
    grid-column:1/-1; text-align:center; padding:60px 20px; color:var(--text-muted);
  }
  .empty-state h3{color:var(--text); margin-bottom:8px; font-size:18px;}

  /* ---------- Modal shared ---------- */
  .overlay{
    display:none; position:fixed; inset:0; background:#000000b0; z-index:100;
    align-items:flex-end; justify-content:center;
  }
  .overlay.open{display:flex;}
  .sheet{
    background:var(--surface); width:100%; max-width:520px; max-height:88vh; overflow-y:auto;
    border-radius:18px 18px 0 0; padding:22px 20px 28px; animation:slideUp .22s ease-out;
  }
  @keyframes slideUp{from{transform:translateY(30px); opacity:0;} to{transform:translateY(0); opacity:1;}}
  .sheet-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;}
  .sheet-head h2{font-size:19px;}
  .close-x{background:var(--surface-2); width:32px; height:32px; border-radius:50%; color:var(--text); font-size:16px;}

  .detail-photo{height:170px; border-radius:12px; margin-bottom:10px; display:flex; align-items:center; justify-content:center; overflow:hidden;
    background:repeating-linear-gradient(90deg, transparent, transparent 26px, #ffffff06 26px, #ffffff06 27px), linear-gradient(160deg,#ffffff08,transparent);}
  .detail-photo img{width:100%; height:100%; object-fit:cover;}
  .detail-photo svg{width:56%;}
  .thumb-row{display:flex; gap:8px; margin-bottom:14px; overflow-x:auto;}
  .thumb-row img{width:56px; height:44px; object-fit:cover; border-radius:6px; opacity:.55; cursor:pointer; border:2px solid transparent; flex-shrink:0;}
  .thumb-row img.active{opacity:1; border-color:var(--accent);}

  /* ---------- Admin photo upload ---------- */
  .upload-zone{
    border:1.5px dashed #ffffff30; border-radius:10px; padding:16px; text-align:center;
    cursor:pointer; margin-bottom:12px; transition:.2s;
  }
  .upload-zone:hover{border-color:var(--accent);}
  .upload-zone input{display:none;}
  .upload-zone .u-label{font-size:13px; color:var(--text-muted);}
  .upload-thumbs{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px;}
  .upload-thumb{position:relative; width:64px; height:52px;}
  .upload-thumb img{width:100%; height:100%; object-fit:cover; border-radius:8px;}
  .upload-thumb .rm{
    position:absolute; top:-6px; right:-6px; width:20px; height:20px; border-radius:50%;
    background:var(--danger); color:#fff; font-size:12px; display:flex; align-items:center; justify-content:center;
  }
  .upload-thumb.uploading{display:flex; align-items:center; justify-content:center; background:var(--surface-2); font-size:10px; color:var(--text-muted);}
  .detail-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:14px 0;}
  .detail-item{background:var(--surface-2); border-radius:10px; padding:10px 12px;}
  .detail-item .l{font-size:11px; color:var(--text-muted);}
  .detail-item .v{font-family:'Kanit',sans-serif; font-weight:600; font-size:14.5px; margin-top:2px;}
  .detail-desc{font-size:13.5px; color:var(--text-muted); margin:12px 0; line-height:1.6;}
  .contact-btn{
    width:100%; background:var(--accent); color:var(--bg); font-weight:700; font-family:'Kanit',sans-serif;
    padding:14px; border-radius:10px; font-size:15px; margin-top:6px;
  }

  /* ---------- Admin ---------- */
  .pass-row{display:flex; gap:8px; margin-top:14px;}
  .pass-row input{flex:1; background:var(--surface-2); border:1px solid #ffffff18; color:var(--text); padding:12px; border-radius:8px; font-size:14px;}
  .pass-row button{background:var(--accent); color:var(--bg); font-weight:700; padding:0 18px; border-radius:8px;}
  .hint{font-size:11.5px; color:var(--text-muted); margin-top:8px;}
  .admin-list-item{
    display:flex; justify-content:space-between; align-items:center; padding:12px; background:var(--surface-2);
    border-radius:10px; margin-bottom:8px; gap:10px;
  }
  .admin-list-item .info{font-size:13px;}
  .admin-list-item .info b{font-family:'Kanit',sans-serif; display:block; font-size:14px;}
  .admin-actions{display:flex; gap:6px;}
  .icon-btn{width:32px; height:32px; border-radius:8px; background:var(--surface); color:var(--text-muted); font-size:14px;}
  .icon-btn.danger{color:var(--danger);}
  .icon-btn.edit:hover{color:var(--accent);}
  .add-new-btn{
    width:100%; background:transparent; border:1.5px dashed #ffffff30; color:var(--text-muted);
    padding:12px; border-radius:10px; font-size:13.5px; margin-bottom:14px;
  }
  .add-new-btn:hover{border-color:var(--accent); color:var(--accent);}

  .form-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px;}
  .form-grid.full{grid-template-columns:1fr;}
  .form-field{display:flex; flex-direction:column; gap:5px;}
  .form-field label{font-size:11.5px; color:var(--text-muted);}
  .form-field input, .form-field select, .form-field textarea{
    background:var(--surface-2); border:1px solid #ffffff18; color:var(--text);
    padding:10px; border-radius:8px; font-size:13.5px; font-family:'Sarabun',sans-serif;
  }
  .form-field textarea{resize:vertical; min-height:60px;}
  .save-btn{width:100%; background:var(--accent); color:var(--bg); font-weight:700; font-family:'Kanit',sans-serif; padding:13px; border-radius:10px; margin-top:6px; font-size:14.5px;}
  .back-link{font-size:12.5px; color:var(--text-muted); margin-bottom:10px; display:inline-block;}
  .toast{
    position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--surface-2);
    border:1px solid var(--accent); color:var(--text); padding:11px 20px; border-radius:24px; font-size:13.5px;
    z-index:200; display:none; box-shadow:0 8px 24px #00000060;
  }
  footer{text-align:center; padding:26px 20px 10px; color:var(--text-muted); font-size:12px;}
  footer a{color:var(--text-muted); text-decoration:underline; text-underline-offset:2px;}
</style>
</head>
<body>
<noscript>
  <div style="padding:24px;font-family:sans-serif;color:#F2F0EA;background:#14161A;">
    <h1>ทางตรง มอเตอร์ | ตลาดรถมือสอง</h1>
    <p>ซื้อขายรถมือสองออนไลน์ ตรงไปตรงมา ไม่มีหมกเม็ด ตรวจสภาพและแจ้งประวัติรถชัดเจนทุกคัน มีรถทุกยี่ห้อ ทุกช่วงราคา พร้อมระบบค้นหาและกรองตามยี่ห้อ ปี ราคา เกียร์ และเชื้อเพลิง</p>
    <p>ทักไลน์หรือโทรสอบถามรถแต่ละคันได้โดยตรง กรุณาเปิด JavaScript เพื่อดูรายการรถทั้งหมดและใช้งานเว็บไซต์แบบเต็มรูปแบบ</p>
  </div>
</noscript>


<header>
  <div class="logo">
    <svg class="logo-mark" viewBox="0 0 40 40" fill="none">
      <rect width="40" height="40" rx="9" fill="#1E2128"/>
      <path d="M8 24h24M12 24l3-8h10l3 8" stroke="#F5B700" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="14" cy="26" r="2.4" fill="#F5B700"/>
      <circle cx="26" cy="26" r="2.4" fill="#F5B700"/>
    </svg>
    <div>
      <div class="logo-text">ทาง<span>ตรง</span> มอเตอร์</div>
      <div class="logo-sub">USED CAR MARKET</div>
    </div>
  </div>
  <div class="header-actions">
    <button class="icon-round" onclick="shareSite()" title="แชร์เว็บทั้งหมด">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.6" y1="10.5" x2="15.4" y2="6.5"/><line x1="8.6" y1="13.5" x2="15.4" y2="17.5"/></svg>
    </button>
    <button class="admin-btn" onclick="openAdmin()">สำหรับผู้ดูแล</button>
  </div>
</header>

<section class="hero">
  <h1>ซื้อขายรถมือสอง <span class="hl">ตรงไปตรงมา</span> ไม่มีหมกเม็ด</h1>
  <p>ทุกคันตรวจสภาพและแจ้งประวัติชัดเจน ค้นหา กรอง เทียบราคาได้ในที่เดียว</p>
  <div class="stat-row">
    <div class="stat-block">
      <div class="stat-label">รถในระบบ</div>
      <div class="odometer" id="statCount"></div>
    </div>
    <div class="stat-block">
      <div class="stat-label">ราคาเริ่มต้น (บาท)</div>
      <div class="odometer" id="statMinPrice"></div>
    </div>
  </div>
  <div class="road-line"></div>
</section>

<div class="toolbar">
  <div class="search-row">
    <div class="search-box">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#9BA0AA" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="searchInput" type="text" placeholder="ค้นหา ยี่ห้อ รุ่น ปี...">
    </div>
    <button class="filter-toggle" id="filterToggleBtn" onclick="toggleFilters()">ตัวกรอง</button>
  </div>
  <div class="filter-panel" id="filterPanel">

function populateBrandFilter(){

  sel.innerHTML = '<option value="">ทั้งหมด</option>' + brands.map(b=>`<option value="${b}">${b}</option>`).join('');

function getFiltered(){
  const q = document.getElementById('searchInput').value.trim().toLowerCase();
  const brand = document.getElementById('fBrand').value;
  const trans = document.getElementById('fTrans').value;
  const fuel = document.getElementById('fFuel').value;
  const pMin = parseFloat(document.getElementById('fPriceMin').value) || 0;
  const pMax = parseFloat(document.getElementById('fPriceMax').value) || Infinity;
  const yMin = parseFloat(document.getElementById('fYearMin').value) || 0;
  const yMax = parseFloat(document.getElementById('fYearMax').value) || Infinity;
  const sort = document.getElementById('fSort').value;

  let list = cars.filter(c => {
    const text = (c.brand+' '+c.model+' '+c.year).toLowerCase();
    if(q && !text.includes(q)) return false;
    if(brand && c.brand !== brand) return false;
    if(trans && c.transmission !== trans) return false;
    if(fuel && c.fuel !== fuel) return false;
    if(c.price < pMin || c.price > pMax) return false;
    if(c.year < yMin || c.year > yMax) return false;
    return true;
  });

  if(sort === 'priceAsc') list.sort((a,b)=>a.price-b.price);
  else if(sort === 'priceDesc') list.sort((a,b)=>b.price-a.price);
  else if(sort === 'mileageAsc') list.sort((a,b)=>a.mileage-b.mileage);
  else list.sort((a,b)=>b.dateAdded-a.dateAdded);

  return list;
}

  const url = new URL(window.location.origin + window.location.pathname);
  if(carId) url.searchParams.set('car', carId);
  return url.toString();
}

  const url = buildShareURL(id);
  const shareData = { title: `${label} | ทางตรง มอเตอร์`, text: `สนใจ ${label} ดูรายละเอียดที่นี่`, url };
  if(navigator.share){
    try{ await navigator.share(shareData); }catch(e){ /* user cancelled */ }
  } else {
    openShareMenu(url, shareData.text);
  }
}

    try{ await navigator.share(shareData); }catch(e){ /* user cancelled */ }
  } else {
    openShareMenu(url, shareData.text);
  }
}

function openShareMenu(url, text){
  const menu = document.getElementById('shareMenu');
  const enc = encodeURIComponent(url);
  const encText = encodeURIComponent(text || '');
  menu.innerHTML = `
    <button onclick="copyShareLink('${url}')">🔗 คัดลอกลิงก์</button>
    <button onclick="window.open('https://social-plugins.line.me/lineit/share?url=${enc}','_blank')">💬 แชร์ไป LINE</button>
    <button onclick="window.open('https://www.facebook.com/sharer/sharer.php?u=${enc}','_blank')">📘 แชร์ไป Facebook</button>
    <button onclick="window.open('https://twitter.com/intent/tweet?url=${enc}&text=${encText}','_blank')">✖️ แชร์ไป X</button>
  `;
  menu.classList.add('open');
  setTimeout(()=>document.addEventListener('click', closeShareMenuOnce), 0);
}

function closeShareMenuOnce(e){
  const menu = document.getElementById('shareMenu');
  if(!menu.contains(e.target)){
    menu.classList.remove('open');
    document.removeEventListener('click', closeShareMenuOnce);
  }
}

function copyShareLink(url){
  navigator.clipboard.writeText(url).then(()=>{
    showToast('คัดลอกลิงก์แล้ว');
    document.getElementById('shareMenu').classList.remove('open');
  }).catch(()=>showToast('คัดลอกไม่สำเร็จ'));
}

// handle browser back/forward for deep links
window.addEventListener('popstate', () => {
  const params = new URLSearchParams(window.location.search);
  const carId = params.get('car');
  if(carId && cars.find(c=>c.id===carId)){
    openDetail(carId);
  } else {
    closeOverlay('detailOverlay');
  }
});

// check the URL on load / whenever car list updates for a deep link to a specific car
function handleDeepLink(){
  const params = new URLSearchParams(window.location.search);
  const carId = params.get('car');
  if(!carId) return;

  const c = cars.find(x=>x.id===carId);
  if(c){
    if(!document.getElementById('detailOverlay').classList.contains('open')){
      openDetail(carId);
    }
  } else if(currentDetailCarId === carId || !document.getElementById('detailOverlay').classList.contains('open')){
    // car referenced in the link no longer exists (sold & removed) — send back to homepage
    closeOverlay('detailOverlay');
    const url = new URL(window.location.origin + window.location.pathname);
    history.replaceState({}, '', url);
    showToast('รถคันนี้ถูกขายแล้วหรือไม่มีในระบบแล้ว — พาไปหน้าหลักให้ค่ะ');
  }
}

// ---------- Admin (Firebase Auth) ----------
auth.onAuthStateChanged(user => {
  adminMode = !!user;
  // if admin overlay is open, refresh its view to match auth state
  const overlay = document.getElementById('adminOverlay');
  if(overlay.classList.contains('open')){
    adminMode ? renderAdminList() : renderAdminLogin();
  }
});

function openAdmin(){
  editingId = null;
  auth.currentUser ? renderAdminList() : renderAdminLogin();
  document.getElementById('adminOverlay').classList.add('open');
}

function renderAdminLogin(){
  document.getElementById('adminSheet').innerHTML = `
    <div class="sheet-head">
      <h2>เข้าสู่ระบบผู้ดูแล</h2>
      <button class="close-x" onclick="closeOverlay('adminOverlay')">✕</button>
    </div>
    <div class="form-field" style="margin-bottom:10px;">
      <label>อีเมล</label>
      <input type="email" id="loginEmail" placeholder="admin@example.com">
    </div>
    <div class="form-field" style="margin-bottom:12px;">
      <label>รหัสผ่าน</label>
      <input type="password" id="loginPass" placeholder="••••••••" onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <button class="save-btn" onclick="doLogin()">เข้าสู่ระบบ</button>
    <div class="hint">ต้องสร้างบัญชีแอดมินใน Firebase Console ก่อน (Authentication → Users)</div>
  `;
  setTimeout(()=>document.getElementById('loginEmail')?.focus(), 100);
}

async function doLogin(){
  const email = document.getElementById('loginEmail').value.trim();
  const pass = document.getElementById('loginPass').value;
  if(!email || !pass){ showToast('กรอกอีเมลและรหัสผ่าน'); return; }
  try{
    await auth.signInWithEmailAndPassword(email, pass);
    renderAdminList();
  }catch(e){
    showToast('เข้าสู่ระบบไม่สำเร็จ: อีเมลหรือรหัสผ่านไม่ถูกต้อง');
  }
}

function logout(){
  auth.signOut();
  renderAdminLogin();
}

function renderAdminList(){
  document.getElementById('adminSheet').innerHTML = `
    <div class="sheet-head">
      <h2>จัดการรถในระบบ</h2>
      <button class="close-x" onclick="closeOverlay('adminOverlay')">✕</button>
    </div>
    <div style="display:flex; justify-content:flex-end; margin-bottom:10px;">
      <button class="admin-btn" style="padding:6px 12px;" onclick="logout()">ออกจากระบบ</button>
    </div>
    <button class="add-new-btn" onclick="renderAdminForm(null)">+ เพิ่มรถใหม่</button>
    <div id="adminListItems"></div>
  `;
  const container = document.getElementById('adminListItems');
  if(cars.length === 0){
    container.innerHTML = `<div class="hint">ยังไม่มีรถในระบบ</div>`;
    return;
  }
  container.innerHTML = [...cars].sort((a,b)=>b.dateAdded-a.dateAdded).map(c=>`
    <div class="admin-list-item">
      <div class="info">
        <b>${c.brand} ${c.model}</b>
        ปี ${c.year} · ${fmtNum(c.price)} บาท · ${c.status==='available'?'พร้อมขาย':'ขายแล้ว'}
      </div>
      <div class="admin-actions">
        <button class="icon-btn edit" onclick="renderAdminForm('${c.id}')" title="แก้ไข">✎</button>
        <button class="icon-btn danger" onclick="deleteCar('${c.id}')" title="ลบ">🗑</button>
      </div>
    </div>
  `).join('');
}

          <option value="manual" ${c&&c.transmission==='manual'?'selected':''}>เกียร์ธรรมดา</option>

      <div class="form-field"><label>เบอร์ติดต่อ</label><input id="fld-phone" value="${c?c.phone:''}" placeholder="081-234-5678"></div>

// ---------- Photo upload (Cloudinary) ----------
let formImages = [];

function renderUploadThumbs(){
  const box = document.getElementById('uploadThumbs');
  if(!box) return;
  box.innerHTML = formImages.map((url, i) => `
    <div class="upload-thumb">
      <img src="${url}">
      <div class="rm" onclick="removeFormImage(${i})">✕</div>
    </div>
  `).join('');
}

function removeFormImage(i){
  formImages.splice(i, 1);
  renderUploadThumbs();
}

async function handlePhotoSelect(event){
  const files = Array.from(event.target.files || []);
  if(!files.length) return;
  const remaining = 5 - formImages.length;
  const toUpload = files.slice(0, Math.max(remaining, 0));
  if(toUpload.length < files.length) showToast('อัปโหลดได้สูงสุด 5 รูปต่อคัน');

  for(const file of toUpload){
    const box = document.getElementById('uploadThumbs');
    const placeholder = document.createElement('div');
    placeholder.className = 'upload-thumb uploading';
    placeholder.textContent = 'กำลังอัป...';
    box.appendChild(placeholder);
    try{
      const url = await uploadToCloudinary(file);
      formImages.push(url);
    }catch(e){
      console.error(e);
      showToast('อัปโหลดรูปไม่สำเร็จ ตรวจสอบค่า Cloudinary config');
    }
    renderUploadThumbs();
  }
  event.target.value = '';
}

async function saveCarForm(){
  const brand = document.getElementById('fld-brand').value.trim();
  const model = document.getElementById('fld-model').value.trim();
  const year = parseInt(document.getElementById('fld-year').value);
  const price = parseFloat(document.getElementById('fld-price').value);
  const mileage = parseFloat(document.getElementById('fld-mileage').value);

  if(!brand || !model || !year || !price || isNaN(mileage)){
    showToast('กรอกข้อมูลให้ครบ: ยี่ห้อ รุ่น ปี ราคา เลขไมล์');
    return;
  }

  const data = {
    brand, model, year, price, mileage,
    transmission: document.getElementById('fld-trans').value,
    fuel: document.getElementById('fld-fuel').value,
    color: document.getElementById('fld-color').value.trim() || 'ไม่ระบุ',
    colorHex: document.getElementById('fld-colorhex').value.trim() || '#9BA0AA',
    phone: document.getElementById('fld-phone').value.trim() || '-',
    status: document.getElementById('fld-status').value,
    description: document.getElementById('fld-desc').value.trim(),
    images: formImages,
  };

  try{
    if(editingId){
      await carsRef.doc(editingId).update(data);
      showToast('บันทึกการแก้ไขแล้ว');
    } else {
      await carsRef.add({...data, dateAdded: Date.now()});
      showToast('เพิ่มรถเข้าระบบแล้ว');
    }
    renderAdminList(); // onSnapshot will also refresh, this keeps UI snappy
  }catch(e){
    console.error(e);
    showToast('บันทึกไม่สำเร็จ ตรวจสอบการเชื่อมต่อ Firebase');
  }
}

async function deleteCar(id){
  if(!confirm('ยืนยันลบรถคันนี้ออกจากระบบ?')) return;
  try{
    await carsRef.doc(id).delete();
    showToast('ลบรถออกจากระบบแล้ว');
  }catch(e){
    console.error(e);
    showToast('ลบไม่สำเร็จ ตรวจสอบการเชื่อมต่อ Firebase');
  }
}

// close overlays on backdrop click
document.getElementById('detailOverlay').addEventListener('click', e=>{ if(e.target.id==='detailOverlay') closeOverlay('detailOverlay'); });
document.getElementById('adminOverlay').addEventListener('click', e=>{ if(e.target.id==='adminOverlay') closeOverlay('adminOverlay'); });

    showToast('เชื่อมต่อ Firebase ไม่สำเร็จ ตรวจสอบ config และ Firestore rules');
  }
  listenToCars();
})();
</script>
